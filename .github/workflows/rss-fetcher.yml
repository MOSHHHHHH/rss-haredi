name: Fetch RSS Feeds

on:
  schedule:
    - cron: '0 * * * *'  # רץ כל שעה עגולה
  workflow_dispatch:     # מאפשר הרצה ידנית מתוך לשונית Actions ב-GitHub

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run RSS fetcher script
        run: python scripts/fetch_rss.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sample/
          git diff --staged --quiet || (git commit -m "Update RSS feeds data [skip ci]" && git push)
