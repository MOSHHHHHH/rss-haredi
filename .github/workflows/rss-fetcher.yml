name: Fetch RSS Feeds

on:
  schedule:
    - cron: '0 * * * *' # רץ בכל שעה עגולה
  workflow_dispatch: # מאפשר הפעלה ידנית מטאב ה-Actions

jobs:
  fetch-rss:
  # שימוש ב-ubuntu-latest שכולל מראש פייתון וכלים נדרשים
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser

      - name: Run RSS fetch script
        run: python fetch_rss.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sample/
          git diff --staged --quiet || git commit -m "Auto-update RSS feeds [skip ci]"
          git push
